<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="40%" stop-color="#e0e7ff"/>
      <stop offset="75%" stop-color="#ede9fe"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="lawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f1f5f9" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Full Canvas Background -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- Soft Ambient Glow Orbs -->
  <circle cx="260" cy="280" r="340" fill="url(#glowGrad)"/>
  <circle cx="1660" cy="260" r="340" fill="url(#glowGrad)"/>
  <circle cx="960" cy="540" r="540" fill="#ffffff" opacity="0.5"/>

  <!-- University Horizon Silhouette (Clocktower, Dome, Columns, Academic Wings) -->
  <g opacity="0.22" fill="#475569">
    <rect x="180" y="580" width="280" height="140" rx="6"/>
    <rect x="1460" y="580" width="280" height="140" rx="6"/>
    <circle cx="140" cy="640" r="65" fill="#64748b" opacity="0.5"/>
    <circle cx="220" cy="630" r="55" fill="#64748b" opacity="0.5"/>
    <circle cx="480" cy="650" r="60" fill="#64748b" opacity="0.5"/>
    <circle cx="1440" cy="650" r="60" fill="#64748b" opacity="0.5"/>
    <circle cx="1700" cy="630" r="55" fill="#64748b" opacity="0.5"/>
    <circle cx="1780" cy="640" r="65" fill="#64748b" opacity="0.5"/>

    <!-- Central Clock Tower & Dome -->
    <path d="M760 620 L960 480 L1160 620 L1160 720 L760 720 Z" fill="#334155"/>
    <path d="M900 480 C900 420, 1020 420, 1020 480 Z" fill="#334155"/>
    <rect x="956" y="390" width="8" height="30" fill="#334155"/>
    <polygon points="960,370 950,390 970,390" fill="#2563eb"/>
    <rect x="810" y="620" width="18" height="100" fill="#ffffff" opacity="0.7"/>
    <rect x="860" y="620" width="18" height="100" fill="#ffffff" opacity="0.7"/>
    <rect x="910" y="620" width="18" height="100" fill="#ffffff" opacity="0.7"/>
    <rect x="990" y="620" width="18" height="100" fill="#ffffff" opacity="0.7"/>
    <rect x="1040" y="620" width="18" height="100" fill="#ffffff" opacity="0.7"/>
    <rect x="1090" y="620" width="18" height="100" fill="#ffffff" opacity="0.7"/>
    <circle cx="960" cy="530" r="22" fill="#ffffff" opacity="0.8"/>
    <circle cx="960" cy="530" r="3" fill="#0f172a"/>
    <line x1="960" y1="530" x2="960" y2="516" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="960" y1="530" x2="970" y2="530" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Left Wing Colonnade -->
    <rect x="520" y="600" width="220" height="120" rx="4"/>
    <polygon points="630,560 520,600 740,600" fill="#475569"/>
    <rect x="550" y="630" width="20" height="45" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="600" y="630" width="20" height="45" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="650" y="630" width="20" height="45" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="700" y="630" width="20" height="45" rx="4" fill="#ffffff" opacity="0.6"/>

    <!-- Right Wing Colonnade -->
    <rect x="1180" y="600" width="220" height="120" rx="4"/>
    <polygon points="1290,560 1180,600 1400,600" fill="#475569"/>
    <rect x="1200" y="630" width="20" height="45" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="1250" y="630" width="20" height="45" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="1300" y="630" width="20" height="45" rx="4" fill="#ffffff" opacity="0.6"/>
    <rect x="1350" y="630" width="20" height="45" rx="4" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- Campus Lawns & Horizon Terraces -->
  <path d="M-100 760 Q400 680 960 740 Q1520 800 2020 720 L2020 1080 L-100 1080 Z" fill="url(#lawnGrad)"/>
  <path d="M-100 840 Q500 780 1000 830 Q1500 880 2020 800 L2020 1080 L-100 1080 Z" fill="#ffffff" opacity="0.75"/>

  <!-- Left Flank: Student Collaborating with Laptop on Campus Terrace -->
  <g transform="translate(180, 710)" filter="url(#softShadow)">
    <ellipse cx="80" cy="200" rx="90" ry="18" fill="#94a3b8" opacity="0.2"/>
    <path d="M40 120 Q40 85 70 78 L90 78 Q120 85 120 120 L125 190 L35 190 Z" fill="#2563eb"/>
    <circle cx="80" cy="48" r="26" fill="#fed7aa"/>
    <path d="M58 44 Q80 22 102 44 Q80 34 58 44" fill="#1e293b"/>
    <rect x="52" y="135" width="56" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <polygon points="40,167 120,167 114,176 46,176" fill="#94a3b8"/>
    <circle cx="80" cy="151" r="5" fill="#2563eb"/>
    <rect x="135" y="162" width="42" height="12" rx="2" fill="#f59e0b"/>
    <rect x="138" y="150" width="38" height="12" rx="2" fill="#8b5cf6"/>
    <rect x="142" y="138" width="32" height="12" rx="2" fill="#10b981"/>
  </g>

  <!-- Right Flank: Student with Notebook & Graduation Cap -->
  <g transform="translate(1580, 710)" filter="url(#softShadow)">
    <ellipse cx="80" cy="200" rx="90" ry="18" fill="#94a3b8" opacity="0.2"/>
    <path d="M40 120 Q40 85 70 78 L90 78 Q120 85 120 120 L125 190 L35 190 Z" fill="#8b5cf6"/>
    <circle cx="80" cy="48" r="26" fill="#fed7aa"/>
    <path d="M58 44 Q80 22 102 44 Q80 34 58 44" fill="#0f172a"/>
    <polygon points="80,20 120,32 80,44 40,32" fill="#0f172a"/>
    <polygon points="112,32 112,52 108,52 108,32" fill="#f59e0b"/>
    <circle cx="110" cy="54" r="3" fill="#f59e0b"/>
    <rect x="60" y="128" width="40" height="48" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
    <line x1="68" y1="140" x2="92" y2="140" stroke="#3b82f6" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="150" x2="92" y2="150" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
    <line x1="68" y1="160" x2="84" y2="160" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Ambient Sparkles -->
  <g fill="#f59e0b">
    <path d="M420 340 L424 352 L436 356 L424 360 L420 372 L416 360 L404 356 L416 352 Z" opacity="0.7"/>
    <path d="M1480 360 L1483 369 L1492 372 L1483 375 L1480 384 L1477 375 L1468 372 L1477 369 Z" opacity="0.8"/>
    <path d="M880 220 L883 229 L892 232 L883 235 L880 244 L877 235 L868 232 L877 229 Z" opacity="0.6"/>
    <path d="M1040 240 L1043 249 L1052 252 L1043 255 L1040 264 L1037 255 L1028 252 L1037 249 Z" opacity="0.6"/>
  </g>
  <circle cx="360" cy="440" r="5" fill="#3b82f6" opacity="0.6"/>
  <circle cx="1540" cy="480" r="6" fill="#8b5cf6" opacity="0.6"/>
  <circle cx="680" cy="320" r="4" fill="#10b981" opacity="0.5"/>
  <circle cx="1240" cy="340" r="4" fill="#3b82f6" opacity="0.5"/>
</svg>
